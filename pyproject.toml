[project]
name = "ai-shell"
version = "0.2.0"
description = "Ask an AI a question from the shell using configurable CLI and API modules"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "google-auth[urllib3]",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
ai = "ai_shell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_shell"]
